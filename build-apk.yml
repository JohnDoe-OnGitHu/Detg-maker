name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'detg-maker-android-new.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download project repository
        uses: actions/checkout@v7

      - name: Check ZIP
        run: |
          echo "Verificando arquivo ZIP..."

          if [ ! -f "detg-maker-android-new.zip" ]; then
            echo "ERRO: ZIP não encontrado!"
            exit 1
          fi

          ls -lh detg-maker-android-new.zip

          if ! unzip -tq detg-maker-android-new.zip; then
            echo "ERRO: O arquivo ZIP está inválido!"
            exit 1
          fi

          echo "ZIP válido!"

      - name: Unpack Android project
        run: |
          mkdir -p project

          unzip -q detg-maker-android-new.zip -d project

          echo "Conteúdo extraído:"
          find project -maxdepth 5 -type f | head -150

          PROJECT_DIR="project/detg-maker-android-new/DETG-Android-Cloud-Build"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERRO: Pasta do projeto Android não encontrada!"
            echo "Pastas disponíveis:"
            find project -maxdepth 5 -type d
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRO: app/build.gradle não encontrado!"
            exit 1
          fi

          echo "Projeto Android encontrado!"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/detg-maker-android-new/DETG-Android-Cloud-Build
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Check generated APK
        run: |
          APK="project/detg-maker-android-new/DETG-Android-Cloud-Build/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado!"
            exit 1
          fi

          ls -lh "$APK"
          echo "APK gerado com sucesso!"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: DETG-Criador-de-Poses-APK
          path: project/detg-maker-android-new/DETG-Android-Cloud-Build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error