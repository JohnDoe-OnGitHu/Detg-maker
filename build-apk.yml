
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'detg-maker-android-new.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download project repository
        uses: actions/checkout@v7

      - name: Check ZIP
        run: |
          if [ ! -f "detg-maker-android-new.zip" ]; then
            echo "ZIP não encontrado!"
            exit 1
          fi
          unzip -tq detg-maker-android-new.zip

      - name: Unpack Android project
        run: |
          mkdir -p project
          unzip -q detg-maker-android-new.zip -d project

          PROJECT_DIR="project/detg-maker-android-new/DETG-Android-Cloud-Build"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Projeto Android não encontrado!"
            find project -maxdepth 5 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "app/build.gradle não encontrado!"
            exit 1
          fi

          echo "Projeto encontrado!"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Fix Kotlin JVM target
        working-directory: project/detg-maker-android-new/DETG-Android-Cloud-Build
        run: |
          cat >> app/build.gradle <<'EOF'

          // Match Kotlin JVM target with Java 1.8
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          EOF

      - name: Build debug APK
        working-directory: project/detg-maker-android-new/DETG-Android-Cloud-Build
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Check generated APK
        run: |
          APK="project/detg-maker-android-new/DETG-Android-Cloud-Build/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK não foi gerado!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: DETG-Criador-de-Poses-APK
          path: project/detg-maker-android-new/DETG-Android-Cloud-Build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
