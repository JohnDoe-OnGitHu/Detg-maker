  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract HTML
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath detg-android-project.zip -DestinationPath project
          New-Item -ItemType Directory -Force desktop-app
          Copy-Item project/DETG-Android-Cloud-Build/app/src/main/assets/index.html desktop-app/index.html

      - name: Create Electron project
        shell: pwsh
        working-directory: desktop-app
        run: |
          @'
          {
            "name": "jii-detg-maker",
            "version": "1.0.0",
            "description": "JII: DETG MAKER",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder"
            },
            "build": {
              "appId": "app.name.name.cool",
              "productName": "JII DETG MAKER",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "index.html"
              ],
              "win": {
                "target": ["nsis", "portable"]
              },
              "artifactName": "${productName}-${version}-${arch}.${ext}"
            }
          }
          '@ | Set-Content -Encoding utf8 package.json

          @'
          const { app, BrowserWindow, shell } = require("electron");
          const path = require("path");

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              autoHideMenuBar: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            win.loadFile(path.join(__dirname, "index.html"));

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith("https://") || url.startsWith("http://")) {
                shell.openExternal(url);
              }
              return { action: "deny" };
            });
          }

          app.whenReady().then(createWindow);

          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") app.quit();
          });
          '@ | Set-Content -Encoding utf8 main.js

      - name: Install Electron
        working-directory: desktop-app
        run: npm install --save-dev electron electron-builder

      - name: Build Windows EXE
        working-directory: desktop-app
        run: npx electron-builder --win nsis portable

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: JII-DETG-MAKER-WINDOWS
          path: desktop-app/dist/*.exe
          if-no-files-found: error
