name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'detg-android-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q detg-android-project.zip -d project
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/DETG-Android-Cloud-Build
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DETG-Criador-de-Poses-APK
          path: project/DETG-Android-Cloud-Build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
